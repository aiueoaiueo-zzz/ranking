<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 一枚の大きな数値表。名前列を左に固定し、見出しタップで並べ替える */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5d6779;
  --line: #dde2ea;
  --accent: #1f6feb;
  --accent-soft: #e3edfd;
  --sorted: #fff6d6;
  --atk: #d4493b; --gun: #2b8a3e; --spr: #c27c0e; --tnk: #3b5bdb;
  --font-text: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #181e27; --fg: #e6eaf1; --muted: #98a2b3; --line: #2a3240;
    --accent: #6ea8ff; --accent-soft: #1d2b44; --sorted: #2e2a17;
    --atk: #ff7b6e; --gun: #5fcf73; --spr: #f0b44c; --tnk: #8ea6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #181e27; --fg: #e6eaf1; --muted: #98a2b3; --line: #2a3240;
  --accent: #6ea8ff; --accent-soft: #1d2b44; --sorted: #2e2a17;
  --atk: #ff7b6e; --gun: #5fcf73; --spr: #f0b44c; --tnk: #8ea6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { display: grid; gap: 14px; max-width: 1600px; margin: 0 auto; min-width: 0; }
header { display: grid; gap: 4px; }
h1 { font-size: 1.45rem; font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: .85rem; margin: 0; }
.sub a { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip, .btn {
  font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.btn { border-radius: 8px; }
.chip:focus-visible, .btn:focus-visible, th button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="search"] {
  font: inherit; font-size: .9rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); width: 12em; max-width: 100%;
}
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.status { font-size: .85rem; color: var(--muted); }
.status b { color: var(--fg); }
.table-box {
  overflow: auto; max-height: calc(100vh - 210px); min-height: 320px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
table { border-collapse: separate; border-spacing: 0; font-size: .82rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; background: var(--surface); z-index: 2; }
thead tr.g th { top: 0; font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-align: left; border-left: 1px solid var(--line); height: 28px; }
thead tr.c th { top: 28px; }
th button {
  all: unset; cursor: pointer; display: flex; gap: 4px; align-items: center; justify-content: flex-end;
  font-weight: 700; width: 100%;
}
th .arrow { color: var(--accent); font-size: .7rem; min-width: .8em; }
th.sorted, td.sorted { background: var(--sorted); }
td.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td.empty { color: var(--muted); opacity: .5; }
td.rank { text-align: right; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stick { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.stick2 { position: sticky; left: 3.2em; z-index: 1; background: var(--surface); border-right: 1px solid var(--line); }
thead .stick, thead .stick2 { z-index: 3; }
td.stick { width: 3.2em; min-width: 3.2em; }
td.name { font-weight: 700; }
td.name .role { display: inline-block; width: 4px; height: 1em; border-radius: 2px; margin-right: 8px; vertical-align: -2px; }
td.name small { color: var(--muted); font-weight: 400; margin-left: 4px; }
tbody tr:hover td { background: var(--accent-soft); }
.multi { color: var(--muted); font-size: .72rem; margin-left: 4px; }
footer { font-size: .78rem; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; max-width: 70ch; }
@media (max-width: 600px) {
  h1 { font-size: 1.2rem; }
  .table-box { max-height: calc(100vh - 260px); }
}
</style>

<div class="wrap">
  <header>
    <h1>やぎシミュ キャラ数値表</h1>
    <p class="sub">見出しをタップすると並べ替えます（1回目 大きい順 → 2回目 小さい順 → 3回目 実装順）。データ提供：<a href="https://yagitools.cloudfree.jp/compas-deck/" target="_blank" rel="noopener">やぎシミュ（チームやぎシミュ）</a></p>
  </header>

  <div class="controls" id="roles"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="キャラ名で絞り込み" aria-label="キャラ名で絞り込み">
    <label class="toggle"><input type="checkbox" id="extra"> 別形態も表示（凸違い・HS版など）</label>
    <button class="btn" id="reset" type="button">実装順に戻す</button>
    <span class="status" id="status"></span>
  </div>

  <div class="table-box">
    <table id="t"><thead></thead><tbody></tbody></table>
  </div>

  <footer>
    <p>HS無敵は場面で値が変わるキャラ（例：1.3/5.5）は一番長い値で並べます。空欄はやぎシミュに値がない項目で、並べ替えると常に一番下に来ます。</p>
    <p>カード欄の「近・周・遠・連・tel」「無・短・長」はやぎシミュの表示アイコンに合わせた区分です。</p>
  </footer>
</div>

,3.2,0.47,1.2,20.0,1.3,1.37,3.27,1.07,2.84,1.64,2.3,3.37,0.77,1.84,2.34,1.79,3.19,0.55,0.94,1.14,1.54,1.67,2.07,4.0,3.0,4.0,null,null]},{"n":115,"name":"やぎなまず","role":"spr","extra":true,"v":[0.05,0.05,0.05,5.0,30.0,1.0,10.0,1000.0,[180.0,null],null,null,0.0,0.0,0.0,null,null,0.77,2.0,1.18,3.34,1.76,2.74,3.66,0.98,3.85,4.75,1.59,2.99,0.35,0.75,0.76,1.15,1.02,1.41,1.0,1.0,1.0,null,null]}]};
const COLS = DATA.columns;
const ROLE_ORDER = ["atk", "gun", "spr", "tnk"];
const state = { sortCol: null, dir: 0, roles: new Set(ROLE_ORDER), q: "", extra: false };

const thead = document.querySelector("#t thead");
const tbody = document.querySelector("#t tbody");
const statusEl = document.getElementById("status");

function fmt(v) {
  if (v === null || v === undefined) return "";
  return Number.isInteger(v) ? String(v) : String(+v.toFixed(3));
}
function val(row, i) {
  const v = row.v[i];
  return Array.isArray(v) ? v[0] : v;
}

// 役割フィルタ
const rolesEl = document.getElementById("roles");
for (const r of ROLE_ORDER) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.id = "role-" + r;
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:var(--${r})"></span>${DATA.roles[r]}`;
  b.addEventListener("click", () => {
    if (state.roles.has(r)) state.roles.delete(r); else state.roles.add(r);
    b.setAttribute("aria-pressed", state.roles.has(r));
    render();
  });
  rolesEl.appendChild(b);
}

// 見出し
function buildHead() {
  const g = document.createElement("tr"); g.className = "g";
  g.innerHTML = `<th class="stick"></th><th class="stick2"></th>`;
  let i = 0;
  while (i < COLS.length) {
    let j = i;
    while (j < COLS.length && COLS[j].group === COLS[i].group) j++;
    const th = document.createElement("th");
    th.colSpan = j - i; th.textContent = COLS[i].group;
    g.appendChild(th); i = j;
  }
  const c = document.createElement("tr"); c.className = "c";
  c.innerHTML = `<th class="stick" style="text-align:right">${"No."}</th><th class="stick2" style="text-align:left">キャラ</th>`;
  COLS.forEach((col, idx) => {
    const th = document.createElement("th");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="arrow"></span>${col.label}`;
    b.addEventListener("click", () => {
      if (state.sortCol !== idx) { state.sortCol = idx; state.dir = -1; }
      else if (state.dir === -1) state.dir = 1;
      else { state.sortCol = null; state.dir = 0; }
      render();
    });
    th.appendChild(b);
    c.appendChild(th);
  });
  thead.append(g, c);
}

function render() {
  const q = state.q.trim();
  let rows = DATA.rows.filter(r =>
    state.roles.has(r.role) && (state.extra || !r.extra) && (!q || r.name.includes(q)));
  rows = rows.slice();
  if (state.sortCol !== null) {
    const i = state.sortCol, d = state.dir;
    rows.sort((a, b) => {
      const x = val(a, i), y = val(b, i);
      if (x === null && y === null) return a.n - b.n;
      if (x === null) return 1;
      if (y === null) return -1;
      return x === y ? a.n - b.n : (x - y) * d;
    });
  } else {
    rows.sort((a, b) => a.n - b.n);
  }

  // 見出しの表示
  thead.querySelectorAll("tr.c th").forEach((th, k) => {
    const idx = k - 2;
    if (idx < 0) return;
    const on = idx === state.sortCol;
    th.classList.toggle("sorted", on);
    th.querySelector(".arrow").textContent = on ? (state.dir === -1 ? "▼" : "▲") : "";
    th.querySelector("button").setAttribute("aria-label",
      COLS[idx].label + (on ? (state.dir === -1 ? "（大きい順）" : "（小さい順）") : ""));
  });

  // 同じ値は同じ順位
  let prev, rank = 0;
  const html = rows.map((r, k) => {
    let first;
    if (state.sortCol !== null) {
      const v = val(r, state.sortCol);
      if (v === null) first = "";
      else { if (v !== prev) rank = k + 1; prev = v; first = rank; }
    } else first = r.n;
    const cells = COLS.map((_, i) => {
      const raw = r.v[i];
      const v = Array.isArray(raw) ? raw[0] : raw;
      const extra = Array.isArray(raw) && raw[1] ? `<span class="multi">(${raw[1]})</span>` : "";
      const cls = ["num"];
      if (v === null) cls.push("empty");
      if (i === state.sortCol) cls.push("sorted");
      return `<td class="${cls.join(" ")}">${v === null ? "—" : fmt(v) + extra}</td>`;
    }).join("");
    return `<tr><td class="rank stick">${first}</td><td class="name stick2"><span class="role" style="background:var(--${r.role})" title="${DATA.roles[r.role]}"></span>${r.name}${r.extra ? "<small>別形態</small>" : ""}</td>${cells}</tr>`;
  }).join("");
  tbody.innerHTML = html;

  const sortTxt = state.sortCol === null ? "実装順" :
    `${COLS[state.sortCol].label}の${state.dir === -1 ? "大きい順" : "小さい順"}`;
  statusEl.innerHTML = `<b>${rows.length}</b> キャラ・${sortTxt}`;
  thead.querySelector("tr.c th.stick").textContent = state.sortCol === null ? "No." : "順位";
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("extra").addEventListener("change", e => { state.extra = e.target.checked; render(); });
document.getElementById("reset").addEventListener("click", () => { state.sortCol = null; state.dir = 0; render(); });

buildHead();
render();
</script>
