<title>やぎシミュ キャラ数値表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* 2つの見せ方：スマホは「1項目ランキング」（順位・キャラ・値・棒）、PCは全項目の表。どちらも同じ並べ替え状態を共有 */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #5d6779;
  --line: #dde2ea;
  --accent: #1f6feb;
  --accent-soft: #e3edfd;
  --sorted: #fff6d6;
  --bar: #c9dafb;
  --atk: #d4493b; --gun: #2b8a3e; --spr: #c27c0e; --tnk: #3b5bdb;
  --font-text: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #181e27; --fg: #e6eaf1; --muted: #98a2b3; --line: #2a3240;
    --accent: #6ea8ff; --accent-soft: #1d2b44; --sorted: #2e2a17; --bar: #27406b;
    --atk: #ff7b6e; --gun: #5fcf73; --spr: #f0b44c; --tnk: #8ea6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #181e27; --fg: #e6eaf1; --muted: #98a2b3; --line: #2a3240;
  --accent: #6ea8ff; --accent-soft: #1d2b44; --sorted: #2e2a17; --bar: #27406b;
  --atk: #ff7b6e; --gun: #5fcf73; --spr: #f0b44c; --tnk: #8ea6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.wrap { display: grid; gap: 12px; max-width: 1600px; margin: 0 auto; min-width: 0; }
header { display: grid; gap: 4px; }
h1 { font-size: 1.4rem; font-weight: 800; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .8rem; margin: 0; }
.sub a { color: var(--accent); }

/* 操作パネル */
.panel { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
select, input[type="search"] {
  font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); min-width: 0; max-width: 100%;
}
#col { min-width: 12em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-size: .88rem; border: 0; background: var(--bg); color: var(--fg);
  padding: 8px 12px; cursor: pointer; min-height: 40px;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.chip {
  font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--bg);
  color: var(--muted); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 700; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted); min-height: 36px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: .82rem; color: var(--muted); }
.status b { color: var(--fg); }

/* 1項目ランキング */
.rank-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rank-list li {
  display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  padding: 9px 12px; border-bottom: 1px solid var(--line);
}
.rank-list li:last-child { border-bottom: 0; }
.rank-list .pos { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: .85rem; }
.rank-list li.top .pos { color: var(--accent); font-weight: 700; }
.rank-list .nm { font-weight: 700; font-size: .95rem; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
.rank-list .nm small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.rank-list .role { flex: none; width: 4px; height: 1.1em; border-radius: 2px; }
.rank-list .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1rem; text-align: right; }
.rank-list .val .multi { display: block; font-size: .7rem; color: var(--muted); font-weight: 400; }
.rank-list .val.empty { color: var(--muted); opacity: .5; font-weight: 400; }
.rank-list .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rank-list .bar i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
.rank-list li.top .bar i { background: var(--accent); }

/* 全項目の表 */
.table-box {
  overflow: auto; max-height: calc(100vh - 120px); min-height: 320px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  -webkit-overflow-scrolling: touch;
}
table { border-collapse: separate; border-spacing: 0; font-size: .82rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; background: var(--surface); z-index: 2; }
thead tr.g th { top: 0; font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-align: left; border-left: 1px solid var(--line); height: 28px; }
thead tr.c th { top: 28px; }
th button {
  all: unset; cursor: pointer; display: flex; gap: 4px; align-items: center; justify-content: flex-end;
  font-weight: 700; width: 100%;
}
th .arrow { color: var(--accent); font-size: .7rem; min-width: .8em; }
th.sorted, td.sorted { background: var(--sorted); }
td.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td.empty { color: var(--muted); opacity: .5; }
td.rank { text-align: right; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stick { position: sticky; left: 0; z-index: 1; background: var(--surface); width: 3em; min-width: 3em; }
.stick2 { position: sticky; left: 3em; z-index: 1; background: var(--surface); border-right: 1px solid var(--line); }
thead .stick, thead .stick2 { z-index: 3; }
td.name { font-weight: 700; }
td.name .role { display: inline-block; width: 4px; height: 1em; border-radius: 2px; margin-right: 8px; vertical-align: -2px; }
td.name small { color: var(--muted); font-weight: 400; margin-left: 4px; }
tbody tr:hover td { background: var(--accent-soft); }
.multi { color: var(--muted); font-size: .72rem; margin-left: 4px; }

footer { font-size: .76rem; color: var(--muted); display: grid; gap: 4px; }
footer p { margin: 0; max-width: 70ch; }

@media (max-width: 640px) {
  h1 { font-size: 1.15rem; }
  .sub .hint { display: none; }
  .panel { padding: 10px; gap: 8px; }
  .row.main { gap: 6px; }
  .row.main > .field { flex: 1 1 100%; }
  .row.main > .field > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .seg button { padding: 6px 8px; min-height: 36px; font-size: .84rem; }
  select { padding: 7px 10px; }
  td.name { max-width: 8.5em; }
  #col { width: 100%; }
  .row.main .seg { flex: 1 1 auto; }
  .row.main .seg button { flex: 1; }
  .roles { flex-wrap: nowrap; overflow-x: auto; margin-inline: -12px; padding-inline: 12px; scrollbar-width: none; }
  .roles .chip { flex: none; }
  input[type="search"] { flex: 1 1 10em; }
  table { font-size: .76rem; }
  th, td { padding: 6px 7px; }
  td.name { overflow: hidden; text-overflow: ellipsis; }
  .table-box { max-height: calc(100vh - 80px); }
}
</style>

<div class="wrap">
  <header>
    <h1>やぎシミュ キャラ数値表</h1>
    <p class="sub"><span class="hint">項目を選ぶか、表の見出しをタップして並べ替えます。</span>データ提供：<a href="https://yagitools.cloudfree.jp/compas-deck/" target="_blank" rel="noopener">やぎシミュ（チームやぎシミュ）</a></p>
  </header>

  <div class="panel">
    <div class="row main">
      <label class="field"><span>項目</span><select id="col"></select></label>
      <div class="field"><span>並び順</span>
        <div class="seg" id="dir">
          <button type="button" data-dir="-1">大きい順</button>
          <button type="button" data-dir="1">小さい順</button>
          <button type="button" data-dir="0">実装順</button>
        </div>
      </div>
      <div class="field"><span>表示</span>
        <div class="seg" id="view">
          <button type="button" data-view="one">この項目だけ</button>
          <button type="button" data-view="all">全項目の表</button>
        </div>
      </div>
    </div>
    <div class="row roles" id="roles"></div>
    <div class="row">
      <input type="search" id="q" placeholder="キャラ名で絞り込み" aria-label="キャラ名で絞り込み">
      <label class="toggle"><input type="checkbox" id="extra"> 別形態も表示</label>
      <span class="status" id="status"></span>
    </div>
  </div>

  <ol class="rank-list" id="list" hidden></ol>
  <div class="table-box" id="tableBox" hidden>
    <table id="t"><thead></thead><tbody></tbody></table>
  </div>

  <footer>
    <p>別形態は、マルコスの凸違い・サーティーン(atk)・HS版などの、同じキャラの別データです。</p>
    <p>HS無敵は場面で値が変わるキャラ（例：1.3/5.5）は一番長い値で並べます。「—」はやぎシミュに値がない項目で、並べ替えると常に一番下に来ます。</p>
    <p>カード欄の「近・周・遠・連・tel」「無・短・長」はやぎシミュの表示アイコンに合わせた区分です。</p>
  </footer>
</div>

<script>
const DATA = __DATA__;
const COLS = DATA.columns;
const ROLE_ORDER = ["atk", "gun", "spr", "tnk"];
const narrow = window.matchMedia("(max-width: 640px)").matches;
const state = {
  col: 0, dir: 0, view: narrow ? "one" : "all",
  roles: new Set(ROLE_ORDER), q: "", extra: false,
};
// 前回の見方を覚えておく（使えないときは無視）
try {
  const saved = JSON.parse(localStorage.getItem("yagi-table") || "null");
  if (saved && saved.col < COLS.length) Object.assign(state, { col: saved.col, dir: saved.dir, view: saved.view || state.view });
} catch (e) {}
function save() {
  try { localStorage.setItem("yagi-table", JSON.stringify({ col: state.col, dir: state.dir, view: state.view })); } catch (e) {}
}

const $ = id => document.getElementById(id);
const thead = document.querySelector("#t thead");
const tbody = document.querySelector("#t tbody");

function fmt(v) {
  if (v === null || v === undefined) return "";
  return Number.isInteger(v) ? String(v) : String(+v.toFixed(3));
}
function val(row, i) { const v = row.v[i]; return Array.isArray(v) ? v[0] : v; }
function multi(row, i) { const v = row.v[i]; return Array.isArray(v) && v[1] ? v[1] : ""; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// 項目の選択肢（グループごと）
(function buildSelect() {
  const sel = $("col");
  let og = null;
  COLS.forEach((c, i) => {
    if (!og || og.label !== c.group) { og = document.createElement("optgroup"); og.label = c.group; sel.appendChild(og); }
    const o = document.createElement("option"); o.value = i; o.textContent = c.label; og.appendChild(o);
  });
  sel.addEventListener("change", () => { state.col = +sel.value; if (state.dir === 0) state.dir = -1; render(); });
})();

$("dir").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.dir = +b.dataset.dir; render();
});
$("view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.view; render();
});

for (const r of ROLE_ORDER) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.id = "role-" + r;
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:var(--${r})"></span>${DATA.roles[r]}`;
  b.addEventListener("click", () => {
    if (state.roles.has(r)) state.roles.delete(r); else state.roles.add(r);
    b.setAttribute("aria-pressed", state.roles.has(r));
    render();
  });
  $("roles").appendChild(b);
}

// 表の見出し
(function buildHead() {
  const g = document.createElement("tr"); g.className = "g";
  g.innerHTML = `<th class="stick"></th><th class="stick2"></th>`;
  let i = 0;
  while (i < COLS.length) {
    let j = i;
    while (j < COLS.length && COLS[j].group === COLS[i].group) j++;
    const th = document.createElement("th");
    th.colSpan = j - i; th.textContent = COLS[i].group;
    g.appendChild(th); i = j;
  }
  const c = document.createElement("tr"); c.className = "c";
  c.innerHTML = `<th class="stick" style="text-align:right"></th><th class="stick2" style="text-align:left">キャラ</th>`;
  COLS.forEach((col, idx) => {
    const th = document.createElement("th");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="arrow"></span>${col.label}`;
    b.addEventListener("click", () => {
      if (state.col !== idx || state.dir === 0) { state.col = idx; state.dir = -1; }
      else if (state.dir === -1) state.dir = 1;
      else state.dir = 0;
      render();
    });
    th.appendChild(b);
    c.appendChild(th);
  });
  thead.append(g, c);
})();

function sortedRows() {
  const q = state.q.trim();
  const rows = DATA.rows.filter(r =>
    state.roles.has(r.role) && (state.extra || !r.extra) && (!q || r.name.includes(q)));
  const i = state.col, d = state.dir;
  if (d === 0) return rows.sort((a, b) => a.n - b.n);
  return rows.sort((a, b) => {
    const x = val(a, i), y = val(b, i);
    if (x === null && y === null) return a.n - b.n;
    if (x === null) return 1;
    if (y === null) return -1;
    return x === y ? a.n - b.n : (x - y) * d;
  });
}

// 順位（同じ値は同じ順位）。実装順のときは実装番号
function positions(rows) {
  let prev, rank = 0;
  return rows.map((r, k) => {
    if (state.dir === 0) return r.n;
    const v = val(r, state.col);
    if (v === null) return "";
    if (v !== prev) rank = k + 1;
    prev = v; return rank;
  });
}

function renderList(rows, pos) {
  const i = state.col;
  const nums = rows.map(r => val(r, i)).filter(v => v !== null);
  const max = Math.max(...nums.map(Math.abs), 0) || 1;
  $("list").innerHTML = rows.map((r, k) => {
    const v = val(r, i);
    const top = state.dir !== 0 && pos[k] !== "" && pos[k] <= 3;
    const m = multi(r, i);
    const w = v === null ? 0 : Math.max(2, Math.abs(v) / max * 100);
    return `<li class="${top ? "top" : ""}">
      <span class="pos">${pos[k]}</span>
      <span class="nm"><span class="role" style="background:var(--${r.role})" title="${DATA.roles[r.role]}"></span>${esc(r.name)}${r.extra ? "<small>別形態</small>" : ""}</span>
      <span class="val${v === null ? " empty" : ""}">${v === null ? "—" : fmt(v)}${m ? `<span class="multi">${m}</span>` : ""}</span>
      <span class="bar"><i style="width:${w}%"></i></span>
    </li>`;
  }).join("");
}

function renderTable(rows, pos) {
  const sc = state.dir === 0 ? -1 : state.col;
  thead.querySelectorAll("tr.c th").forEach((th, k) => {
    const idx = k - 2;
    if (idx < 0) return;
    const on = idx === sc;
    th.classList.toggle("sorted", on);
    th.querySelector(".arrow").textContent = on ? (state.dir === -1 ? "▼" : "▲") : "";
  });
  thead.querySelector("tr.c th.stick").textContent = state.dir === 0 ? "No." : "順位";
  tbody.innerHTML = rows.map((r, k) => {
    const cells = COLS.map((_, i) => {
      const v = val(r, i), m = multi(r, i);
      const cls = ["num"];
      if (v === null) cls.push("empty");
      if (i === sc) cls.push("sorted");
      return `<td class="${cls.join(" ")}">${v === null ? "—" : fmt(v) + (m ? `<span class="multi">(${m})</span>` : "")}</td>`;
    }).join("");
    return `<tr><td class="rank stick">${pos[k]}</td><td class="name stick2"><span class="role" style="background:var(--${r.role})" title="${DATA.roles[r.role]}"></span>${esc(r.name)}${r.extra ? "<small>別形態</small>" : ""}</td>${cells}</tr>`;
  }).join("");
}

let lastScrolledCol = null;
function render() {
  const rows = sortedRows();
  const pos = positions(rows);

  $("col").value = state.col;
  $("dir").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.dir === state.dir));
  $("view").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));

  $("list").hidden = state.view !== "one";
  $("tableBox").hidden = state.view !== "all";
  if (state.view === "one") renderList(rows, pos); else renderTable(rows, pos);

  // 表のとき、選んだ項目の列が見えるように横スクロール
  if (state.view === "all" && state.col !== lastScrolledCol) {
    const th = thead.querySelectorAll("tr.c th")[state.col + 2];
    const box = $("tableBox");
    const stickW = thead.querySelector("tr.c th.stick2").getBoundingClientRect().right - box.getBoundingClientRect().left;
    const left = th.offsetLeft - stickW - 8;
    if (th.offsetLeft < box.scrollLeft + stickW || th.offsetLeft + th.offsetWidth > box.scrollLeft + box.clientWidth) {
      box.scrollLeft = Math.max(0, left);
    }
    lastScrolledCol = state.col;
  }

  const sortTxt = state.dir === 0 ? "実装順" : `${COLS[state.col].label}の${state.dir === -1 ? "大きい順" : "小さい順"}`;
  $("status").innerHTML = `<b>${rows.length}</b> キャラ・${sortTxt}`;
  save();
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("extra").addEventListener("change", e => { state.extra = e.target.checked; render(); });

render();
</script>
